[package]
name = "mail-auth-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2018"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.mail-auth]
path = ".."
features = ["arc"]

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "mail_auth"
path = "fuzz_targets/mail_auth.rs"
test = false
doc = false

[[bin]]
name = "canonicalize"
path = "fuzz_targets/canonicalize.rs"
test = false
doc = false

[patch.crates-io]
mail-builder = { path = "../../mail-builder" }
